name: Build LoongArch dependency cache

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Translated build runner label; native LoongArch is optional'
        required: false
        default: ubuntu-24.04-arm
        type: string

concurrency:
  group: bambustudio-kylinv10-loongarch64-deps
  cancel-in-progress: true

jobs:
  build:
    name: BambuStudio LoongArch dependencies
    runs-on: ${{ inputs.runner || vars.LOONGARCH_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    env:
      KYLIN_IMAGE: ghcr.io/fishmagic/kylinv10-loongarch64:10.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Enable LoongArch emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify translated build host and disk
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64|aarch64) ;; *) exit 2 ;; esac
          docker info
          df -h

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull Kylin V10 build environment
        shell: bash
        run: docker pull "$KYLIN_IMAGE"

      - name: Build and archive dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/loongarch64-deps"
          docker run --rm --platform linux/loong64 \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/loongarch64-deps:/out" \
            --env BAMBU_JOBS="$(nproc)" \
            --env BAMBU_QEMU_TRANSLATED=1 \
            --env BAMBU_DEPS_ONLY=1 \
            "$KYLIN_IMAGE" /usr/local/bin/build-bambustudio-kylinv10.sh

      - name: Upload dependency cache
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio-loongarch64-deps
          if-no-files-found: error
          compression-level: 0
          path: ${{ runner.temp }}/loongarch64-deps/BambuStudio_loongarch64_deps.tar.zst
