name: Kylin V10 native LoongArch64 BambuStudio

on:
  push:
    branches:
      - loongarch64-adaptation
    paths:
      - 'BuildLinux.sh'
      - 'linux.d/loongarch64'
      - 'deps/**'
      - 'src/**'
      - 'resources/**'
      - 'CMakeLists.txt'
      - 'version.inc'
      - '.github/workflows/loongarch64-kylin.yml'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Translated build runner label; native LoongArch is optional'
        required: false
        default: ubuntu-24.04-arm
        type: string
      deps_run_id:
        description: 'Completed dependency-cache workflow run ID'
        required: false
        default: ''
        type: string
concurrency:
  group: bambustudio-kylinv10-loongarch64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Official BambuStudio on Kylin V10 loongarch64
    runs-on: ${{ inputs.runner || vars.LOONGARCH_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 720
    permissions:
      contents: read
      actions: read
    env:
      KYLIN_IMAGE: ghcr.io/fishmagic/kylinv10-loongarch64:10.1

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Enable LoongArch emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify translated build host and disk
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in x86_64|aarch64) ;; *) exit 2 ;; esac
          docker info
          df -h

      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull Kylin V10 build environment
        shell: bash
        run: docker pull "$KYLIN_IMAGE"
      - name: Download prebuilt Loong dependencies
        if: ${{ inputs.deps_run_id != '' }}
        uses: actions/download-artifact@v6
        with:
          name: BambuStudio-loongarch64-deps
          path: ${{ runner.temp }}/loongarch64-deps
          repository: ${{ github.repository }}
          run-id: ${{ inputs.deps_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build official BambuStudio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bambustudio-loongarch64" "$RUNNER_TEMP/loongarch64-deps"
          DEPS_ARCHIVE=
          if [[ -n "${{ inputs.deps_run_id }}" ]]; then
            DEPS_ARCHIVE=/deps-cache/BambuStudio_loongarch64_deps.tar.zst
            test -s "$RUNNER_TEMP/loongarch64-deps/BambuStudio_loongarch64_deps.tar.zst"
          fi
          docker run --rm --platform linux/loong64 \
            --volume "$GITHUB_WORKSPACE:/src:ro" \
            --volume "$RUNNER_TEMP/bambustudio-loongarch64:/out" \
            --volume "$RUNNER_TEMP/loongarch64-deps:/deps-cache:ro" \
            --env BAMBU_JOBS="$(nproc)" \
            --env BAMBU_DEPS_ARCHIVE="$DEPS_ARCHIVE" \
            --env BAMBU_QEMU_TRANSLATED=1 \
            "$KYLIN_IMAGE" /usr/local/bin/build-bambustudio-kylinv10.sh

      - name: Upload official artifacts
        uses: actions/upload-artifact@v6
        with:
          name: BambuStudio-kylinv10-loongarch64-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          path: |
            ${{ runner.temp }}/bambustudio-loongarch64/BambuStudio_*.tar.gz
            ${{ runner.temp }}/bambustudio-loongarch64/BambuStudio_*.tar.zst
            ${{ runner.temp }}/bambustudio-loongarch64/BambuStudio_*.deb
            ${{ runner.temp }}/bambustudio-loongarch64/BambuStudio_*.sha256
